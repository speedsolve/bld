<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0D1618; --surface:#16262A; --line:#24393E;
    --ink:#EAF2F0; --muted:#7C9A97;
    --amber:#F2B134; --coral:#E2603F; --mint:#4FC08D; --cy:#5AC8E0;
    --key:#F2B134;
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --sans:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
.app.eg{
    --bg:#12131E; --surface:#1E2033; --line:#312F4A;
    --ink:#ECEAF6; --muted:#8B88AD;
    --amber:#B79CF0; --cy:#7FA7F5;
    --key:#B79CF0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#0A1113}
  body{background:#0A1113;margin:0;transition:background .25s}
  body.eg{background:#0C0D16}
  .app b,.app i,.app small,.app strong,.app em{color:inherit;background:transparent}
  .app{background:var(--bg);color:var(--ink);font-family:var(--sans);
       min-height:580px;padding:18px 18px 24px;border-radius:10px;-webkit-font-smoothing:antialiased}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .sy{margin-left:auto;font-size:11px;align-self:center;padding-bottom:8px;letter-spacing:.06em}
  .sy + .cog{margin-left:10px}
  .cog{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:17px;
       cursor:pointer;padding:0 4px 8px;line-height:1}
  .cog:hover{color:var(--ink)}
  .grp{display:flex;gap:6px;margin-bottom:10px}
  .tmwrap{display:flex;flex-direction:column;align-items:center;margin:10px 0 22px}
  .dial{position:relative;display:flex;align-items:center;justify-content:center;
        width:min(70vw,260px);height:min(70vw,260px)}
  .dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .track{fill:none;stroke:var(--line);stroke-width:6}
  .arc{fill:none;stroke:var(--mint);stroke-width:6;stroke-linecap:round;
       transition:stroke-dashoffset .3s linear,stroke .3s}
  .arc.warn{stroke:var(--amber)} .arc.late{stroke:var(--coral)}
  .dial .num{font-family:var(--mono);font-size:clamp(40px,13vw,56px);
             font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
  .tmst{font-size:11px;color:var(--muted);letter-spacing:.16em;margin-top:12px;height:14px}
  .tmwrap.ring .num{animation:tmflash .7s infinite;color:var(--coral)}
  @keyframes tmflash{0%,100%{opacity:1}50%{opacity:.25}}
  .big3{padding:18px 4px;font-size:17px;font-family:var(--mono);flex:1}
  .big3 small{display:block;font-family:var(--sans);font-size:10px;color:var(--muted);margin-top:4px}
  .tmb{font-family:var(--mono);cursor:pointer}
  .top .tmb{margin-left:auto;padding-bottom:0;align-self:baseline}
  .gb{flex:1;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px;
      color:var(--muted);font-family:var(--sans);font-size:12px;letter-spacing:.1em;cursor:pointer}
  .gb.on{border-color:var(--key);color:var(--key);background:var(--surface)}
  .tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
       font-family:var(--sans);font-size:14px;padding:11px 0 10px;cursor:pointer}
  .tab.on{color:var(--ink);border-bottom-color:var(--key);font-weight:600}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
       border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
  .ttl{font-size:13px;letter-spacing:.14em;color:var(--muted)}
  .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer}

  .streak{display:flex;align-items:center;gap:18px;margin-bottom:18px}
  .sk{font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
  .sk small{font-size:11px;color:var(--muted);font-family:var(--sans);margin-left:4px}
  .cal{display:flex;gap:3px;flex-wrap:wrap;flex:1;justify-content:flex-end}
  .dot{width:9px;height:9px;border-radius:2px;background:var(--line)}
  .dot.on{background:var(--mint)} .dot.today{outline:1px solid var(--muted);outline-offset:1px}

  .tdy{display:flex;align-items:baseline;gap:6px;margin:-8px 0 18px;
       font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tdy b{font-size:22px;font-weight:400;color:var(--mint)}
  .tdy small{font-size:12px;color:var(--muted)}
  .tdy span{font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:.1em;margin-left:6px}

  .scr{font-family:var(--mono);font-size:clamp(15px,4.4vw,19px);line-height:1.9;
       background:var(--surface);border-radius:10px;padding:16px;word-spacing:.25em}
  .tst{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;text-align:center}
  .tst .big{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .tst .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .mm{display:flex;flex-wrap:wrap;gap:8px}
  .mp{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);
      border-radius:8px;padding:9px 12px;font-family:var(--mincho);font-size:19px;cursor:pointer}
  .mp .w{font-size:13px;color:var(--key)}
  .fl2{display:flex;gap:8px;margin-bottom:10px}
  .fl2 input{flex:1;margin:0}
  .fl2 .chip{white-space:nowrap}
  .fl2 input.bad2{border-color:var(--coral)}
  .dp{display:inline-flex;align-items:baseline;gap:7px;border:1px solid var(--line);
      border-radius:8px;padding:8px 11px;margin:0 8px 8px 0;cursor:pointer;
      font-family:var(--mincho);font-size:18px;color:var(--ink)}
  .dp b{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--muted)}
  .dp i{font-style:normal;font-size:11px;font-family:var(--sans)}
  .dp.s0{border-color:var(--mint)} .dp.s0 i{color:var(--mint)}
  .dp.s1{border-color:var(--coral);color:var(--coral)} .dp.s1 i{color:var(--coral)}
  .dp.s2{opacity:.45} .dp.s2 i{color:var(--muted)}
  .dpa{display:block;font-family:var(--mono);font-size:13px;color:var(--cy);
       line-height:1.6;margin:-2px 0 10px;padding-left:2px;word-break:break-word;animation:fade .18s}
  .dpa .wd{font-family:var(--mincho);font-size:14px;color:var(--key);margin-right:10px}
  .fx1{background:var(--surface);border:1px solid var(--line);border-radius:8px;
       padding:10px 12px;margin-bottom:8px}
  .fx1 .hd{display:flex;align-items:baseline;gap:9px}
  .fx1 b{font-family:var(--mincho);font-size:19px;font-weight:400;color:var(--ink)}
  .fx1 .ps{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .fx1 .wd{font-family:var(--mincho);font-size:14px;color:var(--key)}
  .fx1 .ed{margin-left:auto;font-style:normal;font-size:11px;color:var(--muted);
           border:1px solid var(--line);border-radius:5px;padding:2px 7px;cursor:pointer}
  .fx1 .ag{font-family:var(--mono);font-size:13px;color:var(--cy);line-height:1.6;
           margin-top:5px;word-break:break-word}
  .mp.par{border-color:var(--coral);cursor:default}
  .mp.par .w{color:var(--coral)}
  .mp.flag{border-color:var(--amber)}

  .ch{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;font-family:var(--mincho);
      font-size:clamp(30px,9vw,44px);line-height:1.2;letter-spacing:.06em}
  .cw{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;animation:fade .18s}
  .cwi{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:8px;
       padding:8px 11px;font-family:var(--mincho);font-size:17px;cursor:pointer}
  .cwi b{font-weight:400;color:var(--key);font-size:15px}
  .cwi.bad{border-color:var(--coral)} .cwi.bad b{color:var(--coral)}
  .cwi .ed{font-style:normal;font-family:var(--sans);font-size:11px;color:var(--muted);
           border:1px solid var(--line);border-radius:5px;padding:2px 6px;margin-left:2px}

  .lab{font-size:11px;letter-spacing:.16em;color:var(--muted);margin-bottom:9px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .chip{background:transparent;border:1px solid var(--line);color:var(--ink);
        font-family:var(--sans);font-size:13px;padding:9px 14px;border-radius:999px;cursor:pointer}
  .chip.on{background:var(--amber);border-color:var(--amber);color:#0D1618;font-weight:600}
  .chip:disabled{opacity:.3}
  .go{width:100%;background:var(--amber);color:#0D1618;border:0;border-radius:8px;
      font-family:var(--sans);font-size:16px;font-weight:700;padding:16px;cursor:pointer}
  .gh{width:100%;background:transparent;border:1px solid var(--line);color:var(--muted);
      border-radius:8px;font-family:var(--sans);font-size:13px;padding:12px;cursor:pointer;margin-top:9px}

  .card.nx{cursor:pointer}
  .nxt{font-size:11px;color:var(--muted);opacity:.6;margin-top:10px;letter-spacing:.08em}
  .card{background:var(--surface);border-radius:12px;padding:26px 16px;text-align:center;
        cursor:pointer;user-select:none;min-height:228px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .pair{font-family:var(--mincho);font-size:clamp(56px,18vw,92px);line-height:1;letter-spacing:.06em}
  .pos{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:-6px}
  .ans{font-family:var(--mincho);font-size:clamp(23px,6.5vw,32px);color:var(--amber);animation:fade .18s}
  .alg{font-family:var(--mono);font-size:clamp(14px,4vw,18px);color:var(--cy);line-height:1.65;
       animation:fade .18s;word-break:break-word;max-width:400px}
  .aw{font-family:var(--mincho);font-size:clamp(17px,4.6vw,22px);color:var(--amber);
      animation:fade .18s;margin:2px 0 -2px}
  .conf{font-size:11px;color:var(--muted);line-height:1.9;max-width:340px;animation:fade .3s}
  .conf b{color:var(--coral);font-weight:600}
  .hint{font-size:12px;color:var(--muted);letter-spacing:.1em}
  .edl{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}

  .clock{display:flex;justify-content:space-between;align-items:baseline;margin:12px 2px}
  .now{font-family:var(--mono);font-size:30px;font-variant-numeric:tabular-nums}
  .per{font-size:13px;color:var(--muted);margin-left:9px}
  .prog{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .marks{display:grid;gap:10px;margin-top:12px}
  .marks.two{grid-template-columns:1fr 1fr}
  .fx{color:var(--coral);font-size:11px}
  .mk{border:0;border-radius:8px;padding:16px 4px;font-family:var(--sans);font-size:14px;
      font-weight:600;cursor:pointer}
  .ok{background:var(--mint);color:#0D1618} .ng{background:var(--coral);color:#fff}
  .rp{background:transparent;border:1px solid var(--amber);color:var(--amber)}

  .strip{display:flex;align-items:flex-end;gap:3px;height:52px;margin-top:18px;
         border-bottom:1px solid var(--line);padding-bottom:1px}
  .bar{flex:1;min-width:4px;border-radius:2px 2px 0 0;background:var(--mint)}
  .bar.k1{background:var(--amber)} .bar.k2{background:var(--coral)}
  .bar.e{background:var(--line);height:3px!important}

  .rt{font-size:14px;color:var(--ink)}
  .rr{display:grid;grid-template-columns:58px 1fr 62px;gap:12px;align-items:baseline;
      padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink)}
  .rr .p{font-family:var(--mincho);font-size:19px;color:var(--ink)}
  .rr .w{color:var(--muted)}
  .rr .a{color:var(--muted);font-family:var(--mono);font-size:11px;line-height:1.5;word-break:break-word}
  .rr .t{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  .rr.k1 .t{color:var(--amber)} .rr.k2 .t{color:var(--coral)} .rr.k2 .p{color:var(--coral)}
  .big{font-family:var(--mono);font-size:38px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .stats{display:flex;gap:24px;margin:6px 0 20px}
    .ltr{flex-wrap:wrap;gap:6px;margin-bottom:4px}
  .ltr .chip{flex:0 0 auto;min-width:44px;padding:9px 6px;font-size:15px}
  .ln{font-size:10px;color:var(--muted);margin-left:3px}
  .trend{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .bars{display:flex;align-items:flex-end;gap:3px;height:40px}
  .bar{width:7px;background:var(--mint);border-radius:2px;opacity:.55}
  .bar:last-child{opacity:1}
  .note{font-size:12px;color:var(--muted);line-height:1.75;margin-top:16px;
        border-top:1px solid var(--line);padding-top:13px}
  .weak{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .wp{font-family:var(--mincho);font-size:15px;background:var(--surface);padding:4px 9px;
      border-radius:5px;cursor:pointer}
  .wp span{font-family:var(--mono);font-size:10px;margin-left:5px}
  .wp .a{color:var(--amber)} .wp .c{color:var(--coral)}

  input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
        border-radius:7px;padding:11px 12px;font-family:var(--sans);font-size:15px;resize:vertical}
  textarea{font-family:var(--mono);font-size:14px;line-height:1.6;min-height:78px}
  input:focus,textarea:focus{outline:none;border-color:var(--amber)}
  .list{max-height:380px;overflow-y:auto;margin-top:12px}
  .li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink)}
  .li .k{font-family:var(--mincho);font-size:18px;width:48px;flex:none}
  .li .v{flex:1;font-family:var(--mincho);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li .v.m{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .li .m2{font-size:10px;color:var(--amber);font-family:var(--mono);flex:none}
  .sheet{background:var(--surface);border-radius:10px;padding:16px;margin-top:14px}
  .sheet .k{font-family:var(--mincho);font-size:30px;text-align:center}
  .sheet .kp{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-bottom:12px}
  .sheet .kw{font-family:var(--mincho);font-size:19px;color:var(--amber);text-align:center;margin-bottom:12px}
  .sheet .fl{font-size:11px;color:var(--muted);margin:12px 0 6px;letter-spacing:.1em}
  .sr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .fld{min-width:0}

  /* ---------- 広い画面（Mac の Chrome など） ---------- */
  @media (min-width:820px){
    .app{max-width:860px;margin:0 auto;padding:26px 34px 40px;border-radius:0;min-height:100vh}
    .tab{flex:0 0 auto;padding:12px 26px 11px;font-size:15px}
    .grp{max-width:360px}
    .cfg{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;align-items:start}
    .cfg .wide{grid-column:1 / -1}
    .card{min-height:300px;padding:38px 24px}
    .list{max-height:min(56vh,620px)}
    .li .v{font-size:16px}
    .go{padding:18px;font-size:17px}
    .gh{padding:13px;font-size:14px}
    .sheet{padding:22px 26px}
    .note{font-size:12.5px}
    .streak{gap:26px}
    .scr{padding:20px 22px;line-height:2.05;font-size:19px}
    .tst{gap:14px}
    .strip{height:64px}
    .conf{max-width:none}
    .alg{max-width:560px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;align-items:start}
  }
  @media (hover:hover){
    .chip:hover:not(:disabled){border-color:var(--key);color:var(--key)}
    .chip.on:hover{color:#0D1618}
    .gh:hover{border-color:var(--muted);color:var(--ink)}
    .go:hover{filter:brightness(1.08)}
    .mk:hover{filter:brightness(1.08)}
    .li:hover{background:var(--surface)}
    .wp:hover{outline:1px solid var(--muted)}
    .cwi:hover,.mp:hover{border-color:var(--muted)}
    .cnt:hover{color:var(--ink)}
  }
  .kbd{display:none}
  @media (min-width:820px) and (hover:hover){
    .kbd{display:inline;font-family:var(--mono);font-size:10px;color:var(--muted);
         border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:7px}
  }
</style>
</head>
<body>

<div class="app" id="app"><div style="padding:24px;font-family:sans-serif;color:#EAF2F0">
  読み込み中…<br><span style="font-size:12px;color:#7C9A97">これが消えない場合は、
  この環境で JavaScript が動いていない可能性があります。</span></div></div>
<div id="err" style="display:none;white-space:pre-wrap;padding:16px;margin:12px;
  border:1px solid #E2603F;border-radius:8px;color:#E2603F;background:#16262A;

function setConf(pair, list){
  (CONF[pair]||[]).forEach(q=>{ if(CONF[q]){ CONF[q]=CONF[q].filter(x=>x!==pair); if(!CONF[q].length) delete CONF[q] } });
  delete CONF[pair];

  const now = pct(a.ok,a.n), was = b.n ? pct(b.ok,b.n) : null;

/* ---------- chain (連続ペア) ---------- */
function chainStart(n, src){
  const pool = SCRAMBLES.filter(x=>{ const k=x.m.length/2; return k>=3 && k<=5 });
  const qs_ = [];
  const seen = new Set(seenSet().memo);
  for(let i=0;i<n;i++){
    let m;
    if(src==='new'){
      let best=-1, cand=[];
      for(const x of pool){
        let c=0; for(let j=0;j+1<x.m.length;j+=2) if(!seen.has(x.m.slice(j,j+2))) c++;
        if(c>best){ best=c; cand=[x] } else if(c===best) cand.push(x);
      }
      m = cand[Math.floor(Math.random()*cand.length)].m;
    } else m = pool[Math.floor(Math.random()*pool.length)].m;
    const ps = []; for(let j=0;j<m.length;j+=2){ const p=m.slice(j,j+2); ps.push(p); seen.add(p) }
    qs_.push(ps);
  }
  S = {mode:'memo', chain:true, q:qs_, i:0, res:[], shown:false};
  chainRun();
}
function chainRun(restore){
  const ps = S.q[S.i];
  const t0 = restore ? null : performance.now();
  if(!restore){ S.shown = false; S.ng = new Set() }
  app.innerHTML = `
    <div class="top"><div class="ttl">連続　${ps.length}ペア</div>
      <div class="cnt" id="quit">中断</div></div>
    <div class="clock"><div class="now" id="now">${restore?ms(S.el):'0.00'}</div>
      <div class="prog">${S.i+1} / ${S.q.length}</div></div>
    <div class="card" id="card" style="min-height:220px">
      <div class="ch">${ps.map(p=>`<span>${p}</span>`).join('')}</div>
      <div class="hint" id="hint">語を並べたら${TAP}<span class="kbd">Space</span></div></div>`;
  const now = qs('now');
  const tick = restore ? null : setInterval(()=>{ if(!S.shown) now.textContent = ms(performance.now()-t0) }, 31);
  qs('quit').onclick = ()=>{ if(tick) clearInterval(tick); keys(null); setup() };
  const reveal = () => {
    S.shown = true; if(tick) clearInterval(tick);
    if(!restore){ S.el = performance.now()-t0; now.textContent = ms(S.el) }
    qs('card').innerHTML = `<div class="ch">${ps.map(p=>`<span>${p}</span>`).join('')}</div>
      <div class="cw">${ps.map(p=>
      `<span class="cwi ${S.ng.has(p)?'bad':''}" data-cp="${p}">${p}<b>${W[p]||'—'}</b>${
        S.ng.has(p)?'<i class="ed" data-ce="'+p+'">編集</i>':''}</span>`).join('')}</div>
      <div class="hint">違ったものを${TAP}　→　もう一度${TAP}で次へ</div>`;
    bindItems();
  };
  const bindItems = () => {
    app.querySelectorAll('[data-cp]').forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const p=b.dataset.cp;
      S.ng.has(p) ? S.ng.delete(p) : S.ng.add(p);
      restore = true; reveal();
    });
    app.querySelectorAll('[data-ce]').forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      sheet(b.dataset.ce, ()=>chainRun(true));
    });
  };
  keys({Space: press('card')});
  qs('card').onclick = () => {
    if(!S.shown) return reveal();
    const per = S.el/ps.length;
    ps.forEach(p=>{
      const wrong = S.ng.has(p);
      const st = stats.memo, s = st[p] || {seen:0,stuck:0,wrong:0,avg:0,debt:0};
      s.avg = (s.avg*s.seen + per)/(s.seen+1); s.seen++;
      if(wrong){ s.wrong++; s.debt=(s.debt||0)+1 }
      else { if(per >= TH.memo) s.stuck++; s.debt = Math.max(0,(s.debt||0)-1) }
      st[p] = s; noteSeen('memo', p); logQ('memo', p, wrong?2:(per>=TH.memo?1:0), per);
    });
    put('bld:stats2', stats);
    S.res.push({n:ps.length, ms:S.el, ng:S.ng.size});
    S.i++; S.i < S.q.length ? chainRun() : chainDone();
  };
  if(restore) reveal();
}
function chainDone(){
  const N = S.res.length, clean = S.res.filter(r=>!r.ng).length;
  const tot = S.res.reduce((a,r)=>a+r.ms,0), pairs = S.res.reduce((a,r)=>a+r.n,0);
  const ngN = S.res.reduce((a,r)=>a+r.ng,0);
  const d = today();
  if(days[days.length-1] !== d){ days.push(d); days = days.slice(-400); put('bld:days', days) }
  const mx = Math.max(1, ...S.res.map(r=>r.ms/r.n));
  app.innerHTML = `
    <div class="top"><div class="ttl">結果 ・ 連続</div><div class="cnt" id="top">トップ</div></div>
    <div class="sum">
      <div><div class="big">${pct(clean,N)}<small style="font-size:13px">%</small></div><div class="sub">全問正解</div></div>
      <div><div class="big" style="font-size:22px">${pct(pairs-ngN,pairs)}<small style="font-size:13px">%</small></div><div class="sub">ペア単位</div></div>
      <div><div class="big" style="font-size:22px">${ms(tot/pairs)}</div><div class="sub">1ペア平均</div></div></div>
    <div class="strip">${S.res.map(r=>
      `<div class="bar ${r.ng?'k2':''}" style="height:${Math.max(6,(r.ms/r.n)/mx*50)}px"></div>`).join('')}</div>
    <button class="go" style="margin-top:18px" id="again">もう一度</button>
    <button class="gh" id="home">トップへ</button>`;
  qs('top').onclick = setup; qs('home').onclick = setup;
  qs('again').onclick = ()=>chainStart(S.q.length, SEL.memo.src);
  keys({Space: press('again')});
  syncPush();
}

/* ---------- 練習タイマー ---------- */
const TMINS = [15, 30, 60];
let TM = {end:0, total:0, left:0, run:false, ring:false};
let tmTick = null, tmAudio = null, tmAlarm = null, tmLock = null;
const tmFmt = ms => { const s = Math.max(0, Math.ceil(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60, p = n => String(n).padStart(2,'0');
  return h ? h+':'+p(m)+':'+p(x) : p(m)+':'+p(x) };
function tmBadge(){
  if(!TM.total && !TM.ring) return '';
  const c = TM.ring ? 'coral' : TM.run ? 'mint' : 'muted';
  return `<span class="sy tmb" id="tmb" style="color:var(--${c})" title="練習タイマー">${
    TM.ring ? '終了' : tmFmt(TM.left)}</span>`;
}
function tmRefresh(){
  const b = qs('tmb');
  if(b){ b.textContent = TM.ring ? '終了' : tmFmt(TM.left);
    b.style.color = 'var(--' + (TM.ring?'coral':TM.run?'mint':'muted') + ')' }
  else if(TM.total || TM.ring){
    const row = app.querySelector('.tabs') || app.querySelector('.top');
    if(row){ row.insertAdjacentHTML('beforeend', tmBadge());
      const n = qs('tmb'); if(n) n.onclick = timerScreen } }
  if(VIEW === 'timer') tmPaint();
  document.title = TM.ring ? '終了！' : TM.run ? tmFmt(TM.left) + ' 練習中' : 'BLD';
}
async function tmWake(on){
  try{
    if(on && 'wakeLock' in navigator && !tmLock) tmLock = await navigator.wakeLock.request('screen');
    if(!on && tmLock){ tmLock.release(); tmLock = null }
  }catch(e){}
}
function tmBeep(t0, f, d){
  const o = tmAudio.createOscillator(), g = tmAudio.createGain();
  o.type='sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.35,t0+0.02);
  g.gain.setValueAtTime(0.35,t0+d-0.06); g.gain.linearRampToValueAtTime(0,t0+d);
  o.connect(g); g.connect(tmAudio.destination); o.start(t0); o.stop(t0+d+0.02);
}
function tmChime(){
  if(tmAudio) try{ const t = tmAudio.currentTime;
    [0,0.28,0.56].forEach((d,i)=>tmBeep(t+d, [880,1174,1568][i], 0.22)) }catch(e){}
  if(navigator.vibrate) navigator.vibrate([220,120,220,120,320]);
}
function tmLoop(){
  TM.left = TM.end - Date.now();
  if(TM.left <= 0){
    TM.left = 0; TM.run = false; TM.ring = true;
    clearInterval(tmTick); tmTick = null; tmWake(false); tmSave();
    tmChime(); tmAlarm = setInterval(tmChime, 1800);
    if(VIEW === 'timer'){ timerScreen(); return }
  }
  tmRefresh();
}
const tmSave = () => put('bld:tm', {end:TM.end, total:TM.total, run:TM.run, left:TM.left, ring:TM.ring});
function tmStart(min){
  try{ tmAudio = tmAudio || new (window.AudioContext || window.webkitAudioContext)(); tmAudio.resume() }catch(e){}
  TM = {total:min*60000, left:min*60000, end:Date.now()+min*60000, run:true, ring:false};
  clearInterval(tmTick); tmTick = setInterval(tmLoop, 250);
  tmWake(true); tmSave(); tmRefresh();
}
function tmPauseToggle(){
  if(TM.run){ TM.run = false; clearInterval(tmTick); tmTick = null;
    TM.left = TM.end - Date.now(); tmWake(false) }
  else { TM.run = true; TM.end = Date.now() + TM.left;
    clearInterval(tmTick); tmTick = setInterval(tmLoop, 250); tmWake(true) }
  tmSave(); tmRefresh();
}
function tmStop(){
  TM = {end:0, total:0, left:0, run:false, ring:false};
  clearInterval(tmTick); tmTick = null;
  if(tmAlarm){ clearInterval(tmAlarm); tmAlarm = null }
  if(navigator.vibrate) navigator.vibrate(0);
  tmWake(false); tmSave();
  const b = qs('tmb'); if(b) b.remove();
  document.title = 'BLD';
  if(VIEW === 'timer') timerScreen();
}
function tmPaint(){
  const n = qs('tmnum'); if(!n) return;
  n.textContent = tmFmt(TM.left);
  const r = TM.total ? Math.max(0, TM.left)/TM.total : 1;
  const arc = qs('tmarc');
  if(arc){ arc.style.strokeDashoffset = String(282.7*(1-r));
    arc.setAttribute('class', 'arc' + (TM.ring ? ' late' : r<=0.1 ? ' late' : r<=0.25 ? ' warn' : '')) }
  const st = qs('tmst');
  if(st) st.textContent = TM.ring ? 'おつかれさま' : TM.total && !TM.run ? '一時停止中' : '';
  const dial = qs('tmdial'); if(dial) dial.classList.toggle('ring', TM.ring);
}
function timerScreen(){
  VIEW = 'timer'; keys(null); paint();
  app.innerHTML = tabs() + `

        </svg>

      </div>
      <div class="tmst" id="tmst"></div>
    </div>
    ${TM.ring ? `<button class="go" id="tmoff">止める</button>`
      : TM.total ? `<div class="sr"><button class="gh" style="margin:0" id="tmpause">${TM.run?'一時停止':'再開'}</button>
          <button class="gh" style="margin:0" id="tmquit">やめる</button></div>`
      : `<div class="lab">時間を選ぶと始まります</div>
         <div class="row" id="tmrow">${TMINS.map(m=>
           `<button class="chip big3" data-tm="${m}">${m}<small>分</small></button>`).join('')}</div>`}
    <div class="note">画面を消しても時間はずれません。<br>

  bindTabs(); tmPaint();
  app.querySelectorAll('[data-tm]').forEach(b=>b.onclick=()=>{ tmStart(+b.dataset.tm); timerScreen() });
  if(qs('tmpause')) qs('tmpause').onclick = ()=>{ tmPauseToggle(); timerScreen() };
  if(qs('tmquit')) qs('tmquit').onclick = tmStop;

function tmRestore(v){
  if(!v || !v.total) return;
  TM.total = v.total; TM.end = v.end; TM.run = !!v.run; TM.ring = false;
  TM.left = v.run ? v.end - Date.now() : (v.left || 0);
  if(TM.left <= 0){

    TM = {end:0, total:0, left:0, run:false, ring:false}; tmSave(); return;

}

/* ---------- 差分マージ（往復しても二重に数えない） ---------- */
let BASE = null;                    // 前回同期した時点の集計値
const counterSnap = () => ({
  stats: JSON.parse(JSON.stringify({memo:stats.memo||{}, alg:stats.alg||{}, ealg:stats.ealg||{}})),
  rep: {...rep}, erep: {...erep}
});
function mergeCounters(remote){
  const b = BASE || {stats:{memo:{},alg:{},ealg:{}}, rep:{}, erep:{}};
  const R = (remote && remote.stats) || {};
  for(const m of ['memo','alg','ealg']){
    const lo = stats[m] = stats[m]||{}, re = R[m]||{}, ba = (b.stats&&b.stats[m])||{};
    for(const p of new Set([...Object.keys(lo), ...Object.keys(re)])){
      const L = lo[p]||{seen:0,stuck:0,wrong:0,avg:0,debt:0};
      const E = re[p]||{seen:0,stuck:0,wrong:0,avg:0,debt:0};
      const B2 = ba[p]||{seen:0,stuck:0,wrong:0,avg:0,debt:0};
      const add = k => Math.max(0, (E[k]||0) + (L[k]||0) - (B2[k]||0));
      const seen = add('seen');
      const tot = (E.avg||0)*(E.seen||0) + (L.avg||0)*(L.seen||0) - (B2.avg||0)*(B2.seen||0);
      lo[p] = { seen, stuck:add('stuck'), wrong:add('wrong'),
                avg: seen>0 ? Math.max(0,tot)/seen : 0, debt: add('debt') };
    }
  }
  for(const [name, cur] of [['rep', rep], ['erep', erep]]){
    const re = (remote && remote[name]) || {}, ba = b[name]||{};
    for(const p of new Set([...Object.keys(cur), ...Object.keys(re)])){
      const v = Math.max(0, (re[p]||0) + (cur[p]||0) - (ba[p]||0));
      if(v) cur[p] = v; else delete cur[p];
    }
  }
}

async function gistLoad(){
  const r = await fetch(GAPI + GIST.id, {
    headers:{ Authorization:'Bearer ' + GIST.tok, Accept:'application/vnd.github+json' }, cache:'no-store' });
  if(!r.ok) throw new Error('取得に失敗しました（' + r.status + '）' +
    (r.status===401?'：トークンが無効です' + tokInfo()
     : r.status===404?'：gist ID を確認してください' : ''));
  const j = await r.json();
  const f = j.files && (j.files['bld-data.json'] || Object.values(j.files)[0]);
  if(!f) throw new Error('gist にファイルがありません');
  const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  if(!txt || !txt.trim() || txt.trim()==='{}') return null;
  return JSON.parse(txt);
}
async function gistSave(obj){
  const r = await fetch(GAPI + GIST.id, {
    method:'PATCH',
    headers:{ Authorization:'Bearer ' + GIST.tok, Accept:'application/vnd.github+json',
              'Content-Type':'application/json' },
    body: JSON.stringify({ files:{ 'bld-data.json': { content: JSON.stringify(obj) } } })
  });
  if(!r.ok) throw new Error('書き込みに失敗しました（' + r.status + '）' +
    (r.status===401?'：トークンの権限（Gists: Read and write）を確認してください':''));

/* ---------- 自動同期 ---------- */
let SYNC = {busy:false, dirty:false, msg:'', state:''};
const syncOn = () => !!(GIST.id && GIST.tok);
function syncBadge(){
  if(!syncOn()) return '';
  const c = SYNC.state==='ng' ? 'coral' : SYNC.state==='ok' ? 'mint' : 'muted';
  const t = SYNC.state==='ng' ? '同期できず' : SYNC.state==='run' ? '同期中…'
          : SYNC.state==='ok' ? '同期済み' : '未同期';
  return `<span class="sy" id="sy" style="color:var(--${c})" title="${SYNC.msg||''}">${t}</span>`;
}
function refreshBadge(){
  const e = qs('sy'); if(!e) return;
  const c = SYNC.state==='ng' ? 'coral' : SYNC.state==='ok' ? 'mint' : 'muted';
  e.style.color = 'var(--'+c+')';
  e.textContent = SYNC.state==='ng' ? '同期できず' : SYNC.state==='run' ? '同期中…'
    : SYNC.state==='ok' ? '同期済み' : '未同期';
  e.title = SYNC.msg || '';
}
const atHome = () => !!(qs('start') || qs('tstart') || qs('estart'));
const rerender = () => { if(atHome()) goMode(MODE) };
async function autoSync(pull){
  if(!syncOn() || SYNC.busy) { SYNC.dirty = SYNC.dirty || !pull; return }
  SYNC.busy = true; SYNC.state='run'; refreshBadge();
  let got = false;
  try{
    if(pull){
      const remote = await gistLoad();
      if(remote && remote.stats){ applyDump(remote, true, true); got = true }
    }
    await gistSave(snapshot());
    BASE = counterSnap(); put('bld:base', BASE);
    GIST.at = Date.now(); put('bld:gist', GIST);
    SYNC.state='ok'; SYNC.msg = new Date(GIST.at).toLocaleTimeString('ja-JP');
  }catch(e){
    SYNC.state='ng'; SYNC.msg = (e && e.message) || String(e);
  }finally{
    SYNC.busy = false;
    if(got) rerender();
    refreshBadge();
    if(SYNC.dirty){ SYNC.dirty = false; setTimeout(()=>autoSync(false), 1200) }
  }
}
const syncPush = () => { if(syncOn()) setTimeout(()=>autoSync(false), 100) };
document.addEventListener('visibilitychange', () => {
  if(!syncOn()) return;
  if(document.visibilityState === 'hidden') autoSync(false);
  else autoSync(true);
});
window.addEventListener('pagehide', () => { if(syncOn()) autoSync(false) });

/* ---------- 解析したペアの確認 ---------- */
function bindDonePairs(edge){
  const tbl = edge ? EA : A, lbl = edge ? EPOS : POS, mode = edge ? 'ealg' : 'alg';
  const store = edge ? erep : rep, key = edge ? 'bld:erep' : 'bld:rep';
  const wrap = qs('dlist'); if(!wrap) return;
  // 0=済 / 1=できなかった / 2=対象外
  T.state = T.state || {};
  const ps = [];
  for(let i=0;i+1<T.memo.length;i+=2){ const p=T.memo.slice(i,i+2); if(tbl[p]) ps.push(p) }
  T.pairs = ps;
  ps.forEach(p=>{ if(T.state[p]===undefined) T.state[p]=0 });
  const LB=['◯','✕','—'];
  const marks = () => {
    const ng = ps.some(p=>T.state[p]===1);
    const row = qs('tmarks'), ok = qs('tok');
    if(!row || !ok) return;
    ok.style.display = ng ? 'none' : '';
    row.classList.toggle('two', !ng);
  };
  const paint = () => {
    wrap.innerHTML = ps.map(p=>`<span class="dp s${T.state[p]}" data-dp="${p}">${p}<b>${
      lbl[p[0]]}→${lbl[p[1]]}</b><i>${LB[T.state[p]]}</i></span>${
      T.state[p]===1 ? `<div class="dpa">${edge?'':`<span class="wd">${W[p]||''}</span>`}${tbl[p]||'未登録'}</div>` : ''}`).join('');
    wrap.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{
      const p=b.dataset.dp; T.state[p]=(T.state[p]+1)%3; paint();
    });
    marks();
  };
  paint();
  T.commit = () => {
    for(const p of ps){
      const st = T.state[p];
      if(st===2) continue;
      noteSeen(mode, p);
      const S2 = stats[mode] = stats[mode]||{};
      const v = S2[p] || {seen:0,stuck:0,wrong:0,avg:0,debt:0};
      v.seen++;
      if(st===1){ v.wrong++; v.debt=(v.debt||0)+1; store[p]=(store[p]||0)+1 }
      else if(store[p] && --store[p] <= 0) delete store[p];
      S2[p]=v;
    }
    put('bld:stats2', stats); put(key, store); put('bld:seen', seenToday);
  };
}

/* ---------- 回せなかったペアの入力 ---------- */
function bindFlagInput(edge){
  const store = edge ? erep : rep, key = edge ? 'bld:erep' : 'bld:rep';
  const tbl = edge ? EA : A, lbl = edge ? EPOS : POS;
  const added = [];
  const inp = qs('fp'), list = qs('flist'), btn = qs('fadd');
  const paint = () => {
    list.innerHTML = added.map(p=>`<div class="fx1">
      <div class="hd"><b>${p}</b><span class="ps">${lbl[p[0]]}→${lbl[p[1]]}</span>${
        edge?'':`<span class="wd">${W[p]||''}</span>`}<i class="ed" data-fx="${p}">取消</i></div>
      <div class="ag">${tbl[p]||'未登録'}</div></div>`).join('');
    list.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{
      const p=b.dataset.fx, i=added.indexOf(p);
      if(i>=0) added.splice(i,1);
      if(store[p] && --store[p] <= 0) delete store[p];
      put(key, store); paint();
    });
  };
  const add = () => {
    const raw = inp.value.trim();
    if(!raw) return;
    const toks = raw.split(/[\s,、。・]+/).filter(Boolean);
    const out = [];
    for(const t of toks){
      if(t.length % 2 !== 0){ out.push(t); continue }
      for(let i=0;i<t.length;i+=2){
        const p = t.slice(i,i+2);
        if(!tbl[p]){ out.push(p); continue }
        store[p] = (store[p]||0)+1; added.push(p);
      }
    }
    put(key, store);
    inp.value = out.join(' ');
    if(out.length) inp.classList.add('bad2'); else inp.classList.remove('bad2');
    paint(); inp.focus();
  };
  btn.onclick = add;
  inp.onkeydown = e => { if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); add() } };
  paint();
}

function snapshot(){
  return {v:2, at:today(), ts:Date.now(),
    stats, days, th:TH, log, ltr:LTR, words:wOver, algs:aOver, conf:CONF, rep, seen:seenToday, sel:SEL,
    trials, etrials, tset:TSET, ealgs:eaOver, erep, hist};
}
function applyDump(d, merge, counters){
  const nz = o => o && typeof o === 'object' ? o : {};
  if(merge){
    if(counters) mergeCounters(d);
    else {
      // ファイル取り込み（基準が無いので足し合わせ）
      for(const m of ['memo','alg','ealg']){
        const src = nz(d.stats && d.stats[m]); stats[m] = stats[m]||{};
        for(const [k,b] of Object.entries(src)){
          const a = stats[m][k];
          if(!a){ stats[m][k] = {...b, debt: b.debt===undefined ? (b.wrong||0) : b.debt}; continue }
          const n = (a.seen||0) + (b.seen||0);
          stats[m][k] = { seen:n, stuck:(a.stuck||0)+(b.stuck||0), wrong:(a.wrong||0)+(b.wrong||0),
            avg: n ? ((a.avg||0)*(a.seen||0) + (b.avg||0)*(b.seen||0))/n : 0,
            debt: Math.max(a.debt||0, b.debt===undefined ? (b.wrong||0) : b.debt) };
        }
      }
      for(const [k,v] of Object.entries(nz(d.rep))) rep[k] = Math.max(rep[k]||0, v);
      for(const [k,v] of Object.entries(nz(d.erep))) erep[k] = Math.max(erep[k]||0, v);
    }
    days = [...new Set([...days, ...(d.days||[])])].sort().slice(-400);
    const key = t => `${t.at}|${t.ms}|${t.n}`;
    const mix = (a,b) => { const seen=new Set(a.map(key)); 
      return [...a, ...b.filter(t=>!seen.has(key(t)))].sort((x,y)=>x.at<y.at?-1:1).slice(-400) };
    trials = mix(trials, d.trials||[]); etrials = mix(etrials, d.etrials||[]);
    if(d.hist) hist = mergeHist(hist, d.hist);
    if(d.seen) for(const m of ['memo','alg','ealg'])
      seenToday[m] = [...new Set([...(seenToday[m]||[]), ...((d.seen[m])||[])])];
    // 語・手順の編集は「読み込んだ側」を優先
    wOver = {...wOver, ...nz(d.words)}; aOver = {...aOver, ...nz(d.algs)}; eaOver = {...eaOver, ...nz(d.ealgs)};
    if(d.conf) CONF = d.conf;
  } else {
    stats = d.stats||{memo:{},alg:{},ealg:{}}; days = d.days||[]; log = d.log||[];
    wOver = nz(d.words); aOver = nz(d.algs); eaOver = nz(d.ealgs); if(d.conf) CONF = d.conf;
    rep = nz(d.rep); erep = nz(d.erep); trials = d.trials||[]; etrials = d.etrials||[];
    hist = d.hist || [];
    seenToday = d.seen || {d:'',memo:[],alg:[],ealg:[]};
  }
  TH = d.th||TH; LTR = d.ltr||LTR; if(d.sel) SEL = d.sel; if(d.tset) TSET = {...TSET,...d.tset};
  W = {...BASEW, ...wOver}; A = {...BASEA, ...aOver}; EA = {...BASEEA, ...eaOver};
  for(const m of ['memo','alg','ealg']){ stats[m] = stats[m]||{};
    for(const s of Object.values(stats[m])) if(s.debt === undefined) s.debt = s.wrong||0 }
  seenToday.ealg = seenToday.ealg||[];
  put('bld:stats2',stats); put('bld:days',days); put('bld:th2',TH); put('bld:log',log);
  put('bld:ltr',LTR); put('bld:words',wOver); put('bld:algs',aOver); put('bld:conf',CONF);
  put('bld:rep',rep); put('bld:seen',seenToday); put('bld:sel',SEL); put('bld:erep',erep);
  put('bld:ealgs',eaOver); put('bld:trials',trials); put('bld:etrials',etrials); put('bld:tset',TSET); put('bld:hist',hist);
  if(!merge){ BASE = null; put('bld:base', null) }
}

               <input id="c" value="${(CONF[pair]||[]).join(' ')}">` : ''}
      <div class="sr"><button class="go" id="save">保存</button>
        <button class="gh" style="margin:0" id="rev">初期値に戻す</button></div>
    </div>
    ${base ? `<div class="note">初期値　${base}</div>` : ''}`;
  qs('back').onclick = back;
  qs('save').onclick = () => {
    setVal(pair, qs('v').value);
    if(isM) setConf(pair, qs('c').value.split(/\s+/).filter(Boolean));
    back();
  };
  qs('rev').onclick = () => { if(base) setVal(pair, base); back() };
}

/* ---------- drill ---------- */
function start(n, src){
  const all = MODE==='memo' ? PAIRS : MODE==='ealg' ? Object.keys(EA) : PAIRS.filter(p => A[p]);
  let pool = src==='ltr' ? all.filter(p=>p[0]===LTR)
           : src==='new' ? all.filter(p=>!seenSet()[MODE].includes(p))
           : src==='ha' ? all.filter(p=>[...p].some(c=>'はひふへにぬね'.includes(c)))
           : src==='miss' ? missList().map(x=>x[0]).filter(p=>MODE==='memo'||A[p])
           : src==='rep' ? (MODE==='ealg'?erepList():repList()).map(x=>x[0])
           : src==='weak' ? weakList(99).map(x=>x[0]).filter(p=>MODE==='memo'||(MODE==='ealg'?EA[p]:A[p]))
           : src==='conf' ? Object.keys(CONF)
           : all.slice();
  if(!pool.length) pool = all.slice();
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]]}
  S = { q: pool.slice(0, Math.min(n, pool.length)), i:0, res:[], shown:false, mode:MODE, n, src };
  run();
}
function run(){
  const pair = S.q[S.i], mx = Math.max(1200, ...S.res.map(x=>x.ms)), isM = S.mode==='memo';
  app.innerHTML = `
    <div class="top"><div class="ttl">${isM?'変換ドリル':(isE()?'エッジ手順':'手順ドリル')}</div>
      <div class="cnt" id="quit">中断</div></div>
    <div class="clock"><div class="now" id="now">0.00</div>
      <div class="prog">${S.i+1} / ${S.q.length}</div></div>
    <div class="card" id="card"><div class="pair">${pair}</div>
      ${isM?'':`<div class="pos">${PS()[pair[0]]} → ${PS()[pair[1]]}</div>`}
      ${isM||isE()||!W[pair]?'':`<div class="aw">${W[pair]}</div>`}
      <div class="hint" id="hint">${isM?`${TAP}で答え`:`回し終えたら${TAP}`}<span class="kbd">Space</span></div></div>
    <div class="marks${isM||isE()?'':' two'}" id="marks" style="visibility:hidden">
      <button class="mk ng" id="m1">違った<span class="kbd">2</span></button>
      ${isM||isE()?'':`<button class="mk rp" id="m3">要反復<span class="kbd">3</span></button>`}</div>
    <div class="strip">${S.q.map((_,k)=>{const r=S.res[k];
      return r ? `<div class="bar k${r.k}" style="height:${Math.max(6,r.ms/mx*50)}px"></div>`
               : `<div class="bar e"></div>`}).join('')}</div>`;

  const t0 = performance.now(); S.shown = false;
  const now = qs('now');
  const tick = setInterval(()=>{ if(!S.shown) now.textContent = ms(performance.now()-t0) },31);
  const reveal = () => {
    if(S.shown) return;
    S.shown = true; S.el = performance.now()-t0; clearInterval(tick);
    now.innerHTML = ms(S.el) + (isM ? '' : `<span class="per">1回 ${ms(S.el/3)}</span>`);
    now.style.color = S.el < TH[S.mode] ? 'var(--mint)' : 'var(--amber)';
    const c = isM ? CONF[pair] : null;
    qs('hint').outerHTML =
      (isM ? `<div class="ans">${W[pair]}</div>` : `<div class="alg">${AL()[pair]||'未登録'}</div>`)
      + (c ? `<div class="conf">紛れやすい　${c.map(q=>`<b>${q}</b> ${W[q]}`).join('　/　')}</div>` : '')
      + `<div class="edl" id="ed">${isM?'語':'手順'}を変える</div>`
      + `<div class="nxt">${TAP}で次へ</div>`;
    qs('card').classList.add('nx');
    qs('marks').style.visibility = 'visible';
    qs('ed').onclick = e => { e.stopPropagation(); keys(null);
      sheet(pair, ()=>{ S.res.push({pair, ms:S.el, k:0}); S.i++; S.i<S.q.length ? run() : done() }) };
  };
  const mark = (ok, flag) => {
    if(!S.shown) return;
    const k = !ok ? 2 : (S.el < TH[S.mode] ? 0 : 1);
    S.res.push({pair, ms:S.el, k});
    const st = stats[S.mode], s = st[pair] || {seen:0,stuck:0,wrong:0,avg:0,debt:0};
    s.avg = (s.avg*s.seen + S.el)/(s.seen+1); s.seen++;
    if(k===1) s.stuck++;
    if(k===2){ s.wrong++; s.debt = (s.debt||0)+1 }
    else s.debt = Math.max(0, (s.debt||0)-1);
    st[pair] = s; put('bld:stats2', stats);
    noteSeen(S.mode, pair);
    logQ(S.mode, pair, k, S.el);
    if(flag){ rep[pair] = (rep[pair]||0)+1; put('bld:rep', rep) }
    if(S.mode==='ealg' && k!==2 && erep[pair]){
      if(--erep[pair] <= 0) delete erep[pair];
      put('bld:erep', erep);
    }
    if(S.mode==='alg' && k!==2 && rep[pair] && !flag){
      if(--rep[pair] <= 0) delete rep[pair];
      put('bld:rep', rep);
    }
    S.i++; S.i < S.q.length ? run() : done();
  };
  qs('card').onclick = () => S.shown ? mark(true) : reveal();
  qs('m1').onclick = ()=>mark(false);
  if(!isM && !isE()) qs('m3').onclick = ()=>mark(true, true);
  qs('quit').onclick = ()=>{clearInterval(tick); keys(null); setup()};
  keys({
    Space: () => S.shown ? mark(true) : reveal(),
    '1': () => { if(S.shown) mark(true) },
    '2': () => { if(S.shown) mark(false) },
    '3': () => { if(S.shown && !isM && !isE()) mark(true, true) },
  });
}
function applyStat(pair, mode, k, sign){
  const st = stats[mode], s = st[pair]; if(!s) return;
  if(k===1) s.stuck = Math.max(0, s.stuck + sign);
  if(k===2){ s.wrong = Math.max(0, s.wrong + sign); s.debt = Math.max(0, (s.debt||0) + sign) }
  else s.debt = Math.max(0, (s.debt||0) - sign);
  st[pair] = s; put('bld:stats2', stats);
}
function flip(idx){
  const r = S.res[idx], was = r.k;
  const now = was===2 ? (r.ms < TH[S.mode] ? 0 : 1) : 2;
  applyStat(r.pair, S.mode, was, -1);
  applyStat(r.pair, S.mode, now, +1);
  r.k = now;
  if(log.length){
    const L = log[log.length-1];
    L.ok = S.res.filter(x=>x.k!==2).length;
    L.fast = S.res.filter(x=>x.k===0).length;
    put('bld:log', log);
  }
  done(true);
}
function done(redo){
  document.onkeydown = null;
  const d = today(), isM = S.mode==='memo';
  if(days[days.length-1] !== d){ days.push(d); days = days.slice(-400); put('bld:days', days) }
  const tot = S.res.reduce((a,r)=>a+r.ms,0);
  const stk = S.res.filter(r=>r.k===1).length, wr = S.res.filter(r=>r.k===2).length;
  const N = S.res.length, okN = N-wr, fastN = S.res.filter(r=>r.k===0).length;
  const prev = agg(recent(S.mode,5));
  if(!redo){ log.push({d, m:S.mode, n:N, ok:okN, fast:fastN, t:Math.round(tot/N)});
    log = log.slice(-300); put('bld:log', log); }
  const acc = pct(okN,N), pAcc = prev.n ? pct(prev.ok,prev.n) : null;
  const dl = pAcc===null ? '' : acc>pAcc ? `<span style="color:var(--mint)"> ▲${acc-pAcc}</span>`
           : acc<pAcc ? `<span style="color:var(--coral)"> ▼${pAcc-acc}</span>` : '';
  const sw = S.res.filter(r=>r.k===2);
  app.innerHTML = `
    <div class="top"><div class="ttl">結果 ・ ${isM?'変換':(isE()?'エッジ手順':'手順')}　${streak()}日連続</div>
      <div class="cnt" id="home">トップへ</div></div>
    <div class="big">${acc}<span style="font-size:16px;color:var(--muted)">%</span>${dl}</div>
    <div class="sub">正答率${pAcc!==null?`　直近5回 ${pAcc}%`:''}</div>
    <div class="stats">
      <div><div class="big" style="font-size:22px">${pct(fastN,N)}<small style="font-size:13px">%</small></div><div class="sub">${isM?'即答':'速い'}</div></div>
      <div><div class="big" style="font-size:22px">${ms(tot/S.res.length)}</div><div class="sub">平均${isM?'':`　1回 ${ms(tot/S.res.length/3)}`}</div></div>
      <div><div class="big" style="font-size:22px;color:${stk?'var(--amber)':'var(--muted)'}">${stk}</div><div class="sub">${isM?'詰まった':'遅い'}</div></div>
      <div><div class="big" style="font-size:22px;color:${wr?'var(--coral)':'var(--muted)'}">${wr}</div><div class="sub">${isM?'誤変換':'ミス'}</div></div>
    </div>
    <div class="rt">${S.res.map((r,i)=>`<div class="rr k${r.k}" data-i="${i}">
      <div class="p">${r.pair}${r.k===2?' <span class="fx">✕</span>':''}</div>
      <div class="${isM?'w':'a'}">${(isM?W[r.pair]:AL()[r.pair])||''}</div>
      <div class="t">${ms(r.ms)}</div></div>`).join('')}</div>
    <div class="note" style="opacity:.7;font-size:12px">行を${TAP}すると正解／不正解を切り替えられます</div>
    ${sw.length?`<div class="note">語を直したいものは${TAP}で編集　
      ${sw.map(r=>`<span class="wp" data-p="${r.pair}">${r.pair}</span>`).join(' ')}</div>`:''}
    <button class="go" style="margin-top:18px" id="again">同じ設定でもう一度</button>
    <button class="gh" id="top">トップへ戻る</button>`;
  qs('again').onclick = () => { MODE = S.mode; start(S.n, S.src) };
  qs('top').onclick = setup; qs('home').onclick = setup;
  keys({Space: press('again')});
  syncPush();
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ MODE=S.mode; sheet(b.dataset.p, ()=>done(true)) });
  app.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>flip(+el.dataset.i));
}

window.onerror = (m, src, ln, col) => {
  const e = document.getElementById('err');
  if(e){ e.style.display='block'; e.textContent = '起動できませんでした\n' + m + '\n(' + ln + ':' + col + ')' }
};
(async () => {
  try{ await load(); paint(); setup(); autoSync(true) }
  catch(err){
    const e = document.getElementById('err');
    if(e){ e.style.display='block'; e.textContent = '起動できませんでした\n' + (err && err.message || err) }
  }
})();
</script>
</body>
